<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8501a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8a7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="circle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a085;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="circle3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="white" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Connection lines between people -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-dasharray="6,4">
    <line x1="200" y1="200" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="600" y2="200"/>
    <line x1="200" y1="200" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="500" y2="120"/>
    <line x1="500" y1="120" x2="600" y2="200"/>
    <line x1="200" y1="200" x2="300" y2="290"/>
    <line x1="300" y1="290" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="500" y2="290"/>
    <line x1="500" y1="290" x2="600" y2="200"/>
  </g>

  <!-- Person icons (simplified) -->
  <!-- Person 1 - Left -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="185" r="30" fill="url(#circle1)"/>
    <circle cx="200" cy="172" r="10" fill="white" opacity="0.9"/>
    <ellipse cx="200" cy="196" rx="15" ry="10" fill="white" opacity="0.9"/>
  </g>

  <!-- Person 2 - Top Center Left -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="108" r="28" fill="url(#circle2)"/>
    <circle cx="300" cy="96" r="9" fill="white" opacity="0.9"/>
    <ellipse cx="300" cy="118" rx="14" ry="9" fill="white" opacity="0.9"/>
  </g>

  <!-- Person 3 - Center -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="185" r="35" fill="white" opacity="0.2" stroke="white" stroke-width="2"/>
    <circle cx="400" cy="185" r="30" fill="url(#circle1)" opacity="0.85"/>
    <circle cx="400" cy="172" r="10" fill="white" opacity="0.95"/>
    <ellipse cx="400" cy="196" rx="15" ry="10" fill="white" opacity="0.95"/>
  </g>

  <!-- Person 4 - Top Center Right -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="108" r="28" fill="url(#circle3)"/>
    <circle cx="500" cy="96" r="9" fill="white" opacity="0.9"/>
    <ellipse cx="500" cy="118" rx="14" ry="9" fill="white" opacity="0.9"/>
  </g>

  <!-- Person 5 - Right -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="185" r="30" fill="url(#circle2)"/>
    <circle cx="600" cy="172" r="10" fill="white" opacity="0.9"/>
    <ellipse cx="600" cy="196" rx="15" ry="10" fill="white" opacity="0.9"/>
  </g>

  <!-- Person 6 - Bottom Center Left -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="275" r="28" fill="url(#circle3)"/>
    <circle cx="300" cy="263" r="9" fill="white" opacity="0.9"/>
    <ellipse cx="300" cy="285" rx="14" ry="9" fill="white" opacity="0.9"/>
  </g>

  <!-- Person 7 - Bottom Center Right -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="275" r="28" fill="url(#circle1)"/>
    <circle cx="500" cy="263" r="9" fill="white" opacity="0.9"/>
    <ellipse cx="500" cy="285" rx="14" ry="9" fill="white" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="400" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white" opacity="0.95" filter="url(#shadow)">SOCIOLOGIA</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Compreendendo a Sociedade</text>

  <!-- Decorative circles -->
  <circle cx="80" cy="60" r="40" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="720" cy="340" r="50" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="750" cy="80" r="30" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="50" cy="320" r="35" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
</svg>

