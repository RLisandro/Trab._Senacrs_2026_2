<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Humanidades</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <img src="imagem/logotipo.png" alt="Portal Humanidades" class="auth-logo">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <div class="auth-input-visibility">
                        <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required>
                        <button type="button" class="visibility-toggle" data-toggle-visibility="email" data-visible-type="email" data-hidden-type="password" data-field-label="e-mail" aria-label="Ocultar e-mail" aria-pressed="true"><svg class="visibility-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.2 12s3.5-6 9.8-6 9.8 6 9.8 6-3.5 6-9.8 6-9.8-6-9.8-6Z"></path><circle cx="12" cy="12" r="2.5"></circle><path class="visibility-icon-slash" d="m3 3 18 18"></path></svg><span>Ocultar</span></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <div class="auth-input-visibility">
                        <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>
                        <button type="button" class="visibility-toggle" data-toggle-visibility="password" data-visible-type="text" data-hidden-type="password" data-field-label="senha" aria-label="Mostrar senha" aria-pressed="false"><svg class="visibility-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.2 12s3.5-6 9.8-6 9.8 6 9.8 6-3.5 6-9.8 6-9.8-6-9.8-6Z"></path><circle cx="12" cy="12" r="2.5"></circle><path class="visibility-icon-slash" d="m3 3 18 18"></path></svg><span>Mostrar</span></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
                <p class="auth-links">
                    Não tem uma conta? <a href="registro.html">Registre-se</a>
                </p>
            </form>
        </div>
    </div>
    <div id="notification" class="notification" style="display: none;"></div>
    <script src="auth.js"></script>
</body>
</html>
